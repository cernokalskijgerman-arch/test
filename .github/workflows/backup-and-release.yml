name: Automated GitHub Backup & Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Nothing Glyph Studio APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Output Build Failure to Summary
        if: failure()
        run: |
          echo "### ❌ Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/NothingGlyphStudio-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NothingGlyphStudio-debug-apk
          path: release-apk/NothingGlyphStudio-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nothing Glyph Studio APK (v1.0.${{ github.run_number }})"
          body: |
            ### 📱 Nothing Glyph Studio — Аппаратный тест совместимости глифов
            
            Мини-версия для моментальной проверки работы глифов на вашем **Nothing Phone (3a Pro / 2a / 2 / 1)**:
            - 💡 **Тест 1**: Включение / выключение всех глифов сразу (слайдер яркости 0..100%).
            - 🔘 **Тест 2**: Независимое включение/выключение каждого глифа/дуги по отдельности (Дуга 1: Верх-Лево, Дуга 2: Низ-Лево, Дуга 3: Справа).
            - 🔢 **Тест 3**: Поканальный тест каждого одиночного светодиода + круговой авто-обход.
            - ⚡ **Тест 4**: Стробоскоп (10 Гц быстрая пульсация).
            - 🍾 **Тест 5**: Аркада «Световая бутылочка» (круговое вращение с физикой трения и победной вспышкой).
            - 🌊 **Тест 6**: Плавное свечение / дыхание (синусоида 0..255..0 без мерцания PWM).
            - 🔍 **Диагностика**: Статус IPC Glyph Service, распознавание модели (DEVICE_24111) и лог вызовов SDK в реальном времени.
            
            #### 📥 Как установить:
            1. Скачайте файл **`NothingGlyphStudio-debug.apk`** ниже на ваш смартфон.
            2. Откройте скачанный файл и подтвердите установку («Разрешить установку из этого источника»).
            3. Запустите приложение и проверьте работу глифов на задней панели!
          files: release-apk/NothingGlyphStudio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backup:
    name: Package and Backup Glyph Studio
    runs-on: ubuntu-latest
    needs: build-apk

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expo-glyph-studio/package.json

      - name: Install Dependencies
        run: |
          cd expo-glyph-studio
          npm ci

      - name: Verify Expo Export
        run: |
          cd expo-glyph-studio
          npx expo export --no-bytecode

      - name: Create Backup Archive
        run: |
          BACKUP_DATE=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "BACKUP_TAG=backup-${BACKUP_DATE}" >> $GITHUB_ENV
          zip -r "glyph-studio-backup-${BACKUP_DATE}.zip" . -x "*.git*" "*/node_modules/*" "*/.expo/*" "*/build/*"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_TAG }}
          path: glyph-studio-backup-*.zip
          retention-days: 30
