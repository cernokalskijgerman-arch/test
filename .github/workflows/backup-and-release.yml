name: Automated GitHub Backup & Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Nothing Glyph Studio APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            app/build/reports/
          retention-days: 7

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/NothingGlyphStudio-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NothingGlyphStudio-debug-apk
          path: release-apk/NothingGlyphStudio-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nothing Glyph Studio APK (v1.0.${{ github.run_number }})"
          body: |
            ### 📱 Nothing Glyph Studio — APK с поддержкой физических глифов
            
            Этот файл APK устанавливается напрямую на ваш **Nothing Phone (3a Pro / 2a / 2 / 1)**:
            - 💡 **Прямое управление физическими светодиодами** на задней крышке через официальный Nothing Glyph DevKit (`com.nothing.ketchum.permission.ENABLE`).
            - 🎛️ **Секвенсор 16 шагов**, анализатор звука, утилиты (стробоскоп, фонарик) и аркада.
            - 🔍 Полная поддержка 3 непрерывных дуг глифов вокруг блока камер Phone (3a Pro).
            
            #### 📥 Как установить:
            1. Скачайте файл **`NothingGlyphStudio-debug.apk`** ниже на ваш смартфон.
            2. Откройте скачанный файл и подтвердите установку («Разрешить установку из этого источника»).
            3. Запустите приложение и управляйте реальными глифами на спинке телефона!
          files: release-apk/NothingGlyphStudio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backup:
    name: Package and Backup Glyph Studio
    runs-on: ubuntu-latest
    needs: build-apk

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expo-glyph-studio/package.json

      - name: Install Dependencies
        run: |
          cd expo-glyph-studio
          npm ci

      - name: Verify Expo Export
        run: |
          cd expo-glyph-studio
          npx expo export --no-bytecode

      - name: Create Backup Archive
        run: |
          BACKUP_DATE=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "BACKUP_TAG=backup-${BACKUP_DATE}" >> $GITHUB_ENV
          zip -r "glyph-studio-backup-${BACKUP_DATE}.zip" . -x "*.git*" "*/node_modules/*" "*/.expo/*" "*/build/*"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_TAG }}
          path: glyph-studio-backup-*.zip
          retention-days: 30
