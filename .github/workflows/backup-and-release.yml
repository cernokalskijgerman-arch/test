name: Build & Release Nothing Glyph Studio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Nothing Glyph Studio APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Expo Dependencies
        working-directory: expo-glyph-studio
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (expo prebuild)
        working-directory: expo-glyph-studio
        run: npx expo prebuild --platform android --no-install

      - name: Copy debug.keystore if missing
        working-directory: expo-glyph-studio/android
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fresh debug.keystore"
          fi

      - name: Grant Gradle Execute Permission
        working-directory: expo-glyph-studio/android
        run: chmod +x gradlew

      - name: Build Standalone Release APK with Bundled JavaScript
        working-directory: expo-glyph-studio/android
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== RELEASE BUILD FAILED: last 100 lines ==="
            tail -n 100 build.log
            exit $EXIT_CODE
          fi

      - name: Locate and Verify APK Bundle Contents
        id: find_apk
        run: |
          APK=$(find expo-glyph-studio/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find expo-glyph-studio/android/app/build/outputs/apk -name "*.apk" | head -1)
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

          echo "=== Verifying embedded assets & JS bundle inside APK ==="
          unzip -l "$APK" | grep -E "index\.android\.bundle|assets/fonts" || true

          if unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "✅ VERIFIED: index.android.bundle is embedded in APK!"
          else
            echo "::error::index.android.bundle is MISSING from APK! App will fail on device!"
            exit 1
          fi

      - name: Prepare Release APKs
        run: |
          mkdir -p release-apk
          APK="${{ steps.find_apk.outputs.apk_path }}"
          cp "$APK" release-apk/NothingGlyphStudio.apk
          cp "$APK" release-apk/GlyphStudio-LiquidGlass.apk
          cp "$APK" release-apk/NothingGlyphStudio-debug.apk
          echo "Release APKs prepared:"
          ls -lh release-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Nothing Glyph Studio v2.0.${{ github.run_number }}"
          body: |
            ## 🌟 Nothing Glyph Studio — Liquid Glass UI (Standalone Release)

            ### ✅ Что исправлено:
            - **Встроен автономный JS-бандл (`index.android.bundle`)**: приложение больше НЕ требует запущенного Metro-сервера и запускается автономно без красного экрана ошибки.
            - **Аппаратное управление глифами**: Ketchum SDK 2.0 (Nothing Phone 3a Pro — 36 каналов, код A059).
            - **Liquid Glass интерфейс**: 5 экранов (КОНТРОЛЬ, АВТО-ОБХОД, СЕКВЕНСОР, МУЗЫКА, УТИЛИТЫ).

            ### 📱 Установка:
            1. Удалите старую версию с телефона.
            2. Скачайте `NothingGlyphStudio.apk`.
            3. Установите и запустите — приложение загрузится сразу.
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
