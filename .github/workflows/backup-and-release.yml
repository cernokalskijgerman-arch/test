name: Automated GitHub Backup & Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Nothing Glyph Studio APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expo-glyph-studio/package.json

      - name: Install Expo Dependencies
        run: |
          cd expo-glyph-studio
          npm ci

      - name: Run E2E Verification Tests
        run: node tests/e2e_runner.js

      - name: Run Nothing Glyph Hardware Integration Tests
        run: node tests/nothing_glyph_hardware.test.js

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x gradlew
          if [ -f expo-glyph-studio/android/gradlew ]; then chmod +x expo-glyph-studio/android/gradlew; fi

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-tests.log || {
            echo "::error::Unit Tests Failed"
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              echo "=== $f ==="
              cat "$f"
            done
            exit 1
          }

      - name: Build Native Hardware APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Generate Native Android Project for Expo
        run: |
          cd expo-glyph-studio
          npx expo prebuild --platform android --no-install
          cd ..
          chmod +x expo-glyph-studio/android/gradlew
          if [ ! -f expo-glyph-studio/android/app/debug.keystore ] && [ -f app/debug.keystore ]; then
            echo "Copying debug.keystore to expo-glyph-studio/android/app/"
            mkdir -p expo-glyph-studio/android/app
            cp app/debug.keystore expo-glyph-studio/android/app/debug.keystore
          fi

      - name: Build Liquid Glass Studio APK with Gradle
        run: |
          cd expo-glyph-studio/android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../expo-build.log || {
            echo "Release build failed, falling back to debug assemble..."
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a ../../expo-build.log
          }
          cd ../..

      - name: Output Build Failure to Summary
        if: failure()
        run: |
          echo "### ❌ Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            echo "--- $f ---" >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
          done
          if [ -f unit-tests.log ]; then tail -n 80 unit-tests.log >> $GITHUB_STEP_SUMMARY; fi
          if [ -f gradle-build.log ]; then tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY; fi
          if [ -f expo-build.log ]; then tail -n 80 expo-build.log >> $GITHUB_STEP_SUMMARY; fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            unit-tests.log
            gradle-build.log
            expo-build.log

      - name: Prepare APKs for Release
        run: |
          mkdir -p release-apk
          EXPO_APK=""
          if [ -f expo-glyph-studio/android/app/build/outputs/apk/release/app-release.apk ]; then
            EXPO_APK="expo-glyph-studio/android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f expo-glyph-studio/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            EXPO_APK="expo-glyph-studio/android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ -n "$EXPO_APK" ]; then
            echo "Packaging Liquid Glass Expo APK as primary flagship: $EXPO_APK"
            cp "$EXPO_APK" release-apk/NothingGlyphStudio.apk
            cp "$EXPO_APK" release-apk/GlyphStudio-LiquidGlass.apk
            cp "$EXPO_APK" release-apk/NothingGlyphStudio-Hardware.apk
            cp "$EXPO_APK" release-apk/NothingGlyphStudio-debug.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Fallback to native app"
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/NothingGlyphStudio.apk
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/NothingGlyphStudio-Hardware.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlyphStudio-APKs
          path: release-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nothing Glyph Studio — Liquid Glass (v1.0.${{ github.run_number }})"
          body: |
            ### 📱 Nothing Glyph Studio — Полноценная версия Liquid Glass с поддержкой Ketchum SDK 2.0

            🎉 **Готовая стабильная сборка оригинального приложения Nothing Glyph Studio!**
            
            В этом релизе:
            - ✨ **Оригинальный интерфейс Liquid Glass** в аутентичном минималистичном бело-черном стиле Nothing OS.
            - 💡 **Физические глифы на спинке смартфона светятся в реальном времени!** Подключен нативный модуль `nothing-glyph` с библиотекой `glyph-matrix-sdk-2.0.jar`.
            - 🍾 **«Световая бутылочка» (рулетка)**: круговое вращение светового пикселя по глифам камеры, физика нелинейного замедления с трением, тактильный отклик (haptics) и победный световой импульс!
            - 🎛 **5 разделов**: КОНТРОЛЬ (регулировка яркости и дуг), АВТО-ОБХОД (бегущий свет 36 LED, искры, маятник, 120Hz), СЕКВЕНСОР (8-шаговые ритмы), МУЗЫКА (FFT спектр) и УТИЛИТЫ (таймер, индикатор заряда батареи убыванием световых сегментов, аркады).
            - 💎 **Прозрачный выбор параметров и разделов**: плавающий Liquid Glass тач-бар внизу с поддержкой переключения зажатием и наведением (drag & scrub), плавные переходы между разделами.
            
            📥 **Основной APK для скачивания**:
            - **`NothingGlyphStudio.apk`** (также доступен как `GlyphStudio-LiquidGlass.apk` и `NothingGlyphStudio-Hardware.apk`)

            ---

            #### ℹ️ Установка на телефон Nothing Phone:
            1. Скачайте **`NothingGlyphStudio.apk`** прямо на ваш смартфон Nothing Phone.
            2. Откройте файл и установите (если Google Play Защита выдаст предупреждение, нажмите *«Подробнее»* ➔ *«Всё равно установить»*).
            3. Запустите приложение — глифы загорятся сразу же при регулировке ползунков, запуске авто-обхода или вращении бутылочки!
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backup:
    name: Package and Backup Glyph Studio
    runs-on: ubuntu-latest
    needs: build-apk

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expo-glyph-studio/package.json

      - name: Install Dependencies
        run: |
          cd expo-glyph-studio
          npm ci

      - name: Verify Expo Export
        run: |
          cd expo-glyph-studio
          npx expo export --no-bytecode

      - name: Create Backup Archive
        run: |
          BACKUP_DATE=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "BACKUP_TAG=backup-${BACKUP_DATE}" >> $GITHUB_ENV
          zip -r "glyph-studio-backup-${BACKUP_DATE}.zip" . -x "*.git*" "*/node_modules/*" "*/.expo/*" "*/build/*"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_TAG }}
          path: glyph-studio-backup-*.zip
          retention-days: 30
