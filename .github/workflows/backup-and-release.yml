name: Automated GitHub Backup & Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Nothing Glyph Studio APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expo-glyph-studio/package.json

      - name: Install Expo Dependencies
        run: |
          cd expo-glyph-studio
          npm ci

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x gradlew
          if [ -f expo-glyph-studio/android/gradlew ]; then chmod +x expo-glyph-studio/android/gradlew; fi

      - name: Build Native Hardware APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Generate Native Android Project for Expo
        run: |
          cd expo-glyph-studio
          npx expo prebuild --platform android --no-install
          cd ..
          chmod +x expo-glyph-studio/android/gradlew

      - name: Build Liquid Glass Studio APK with Gradle
        run: |
          cd expo-glyph-studio/android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../expo-build.log
          cd ../..

      - name: Output Build Failure to Summary
        if: failure()
        run: |
          echo "### ❌ Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f gradle-build.log ]; then tail -n 60 gradle-build.log >> $GITHUB_STEP_SUMMARY; fi
          if [ -f expo-build.log ]; then tail -n 60 expo-build.log >> $GITHUB_STEP_SUMMARY; fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Prepare APKs for Release
        run: |
          mkdir -p release-apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/NothingGlyphStudio-Hardware.apk
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/NothingGlyphStudio-debug.apk
          fi
          if [ -f expo-glyph-studio/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp expo-glyph-studio/android/app/build/outputs/apk/release/app-release.apk release-apk/GlyphStudio-LiquidGlass.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlyphStudio-APKs
          path: release-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nothing Glyph Studio APK (v1.0.${{ github.run_number }})"
          body: |
            ### 📱 Nothing Glyph Studio — Установочные пакеты APK

            В этом релизе доступны два варианта APK:
            
            1. **`GlyphStudio-LiquidGlass.apk`** — Полная автономная версия приложения:
               - ✨ **Liquid Glass интерфейс** (стиль iOS 18 / Nothing OS).
               - 🎮 **Аркада «Меткий глиф»** с комбо-очками и тактильным откликом.
               - 💫 **Анимация «Комета»** и **«Блеск»** на частоте 120 Гц.
               - 🧘 **Дыхание Zen (4-7-8)** и тактический маяк Морзе (SOS).
               - 🎛 **8-шаговый секвенсор** и FFT визуализатор музыки.
            
            2. **`NothingGlyphStudio-Hardware.apk`** — Прямой аппаратный контроллер глифов через Nothing SDK 2.0.

            ---

            #### ⚠️ Если при установке пишет «Приложение не установлено»:
            1. **Удалите старую версию с телефона**: зажмите иконку приложения на рабочем столе и нажмите **«Удалить»** (так как у новой сборки обновлена цифровая подпись).
            2. **Play Защита**: при появлении предупреждения нажмите **«Подробнее» ➔ «Всё равно установить»**.
            3. **Разрешите установку неизвестных приложений** в настройках вашего браузера или файлового менеджера.
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backup:
    name: Package and Backup Glyph Studio
    runs-on: ubuntu-latest
    needs: build-apk

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expo-glyph-studio/package.json

      - name: Install Dependencies
        run: |
          cd expo-glyph-studio
          npm ci

      - name: Verify Expo Export
        run: |
          cd expo-glyph-studio
          npx expo export --no-bytecode

      - name: Create Backup Archive
        run: |
          BACKUP_DATE=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "BACKUP_TAG=backup-${BACKUP_DATE}" >> $GITHUB_ENV
          zip -r "glyph-studio-backup-${BACKUP_DATE}.zip" . -x "*.git*" "*/node_modules/*" "*/.expo/*" "*/build/*"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_TAG }}
          path: glyph-studio-backup-*.zip
          retention-days: 30
